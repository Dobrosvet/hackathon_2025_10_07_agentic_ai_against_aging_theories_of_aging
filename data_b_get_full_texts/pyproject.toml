[tool.poetry]
name = "data-b-get-full-texts"
version = "0.1.0"
description = "PMC full text downloader microservice"
authors = ["Dobrosvet <dimaprokofev@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.119.0"
uvicorn = {extras = ["standard"], version = "^0.37.0"}
websockets = "^15.0.1"
httpx = "^0.28.1"
qdrant-client = "^1.15.1"
