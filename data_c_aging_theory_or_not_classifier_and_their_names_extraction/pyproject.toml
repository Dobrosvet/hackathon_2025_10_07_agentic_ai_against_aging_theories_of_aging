[tool.poetry]
name = "aging-theory-classifier"
version = "1.0.0"
description = "Aging Theory Classifier and Named Entity Recognition Service using PubMedBERT and GPT-4o"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
qdrant-client = "^1.6.9"
transformers = "^4.36.0"
torch = "^2.1.0"
tqdm = "^4.66.1"
httpx = "^0.25.2"
python-multipart = "^0.0.6"
accelerate = "^0.25.0"
sentencepiece = "^0.1.99"
pyyaml = "^6.0.1"
websockets = "^12.0"
sentence-transformers = "5.1.*"
openai = "^1.50.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
