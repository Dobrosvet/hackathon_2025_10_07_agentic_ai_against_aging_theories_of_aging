# Aging Theory Classifier Service configuration

classifier:
  mode: "embedding"  # keyword | embedding | hybrid | gpt4o
  model_variant: "pubmedbert_sbert"
  model_variants:
    pubmedbert_sbert:
      mode: "embedding"
      embedding_model: "pritamdeka/S-PubMedBert-MS-MARCO"
      bioformer_threshold: 0.6
    gpt4o_mini:
      mode: "gpt4o"
      llm_model: "gpt-4o-mini"
      llm_temperature: 0.0
      llm_max_tokens: 256

  use_gpu: true
  quantize: false
  bioformer_threshold: 0.6
  embedding_threshold: 0.6
  confidence_threshold: 0.5
  batch_size: 32
  max_workers: 2
  embedding_model: "pritamdeka/S-PubMedBert-MS-MARCO"
  llm_model: "gpt-4o-mini"
  llm_temperature: 0.0
  llm_max_tokens: 256

theories:
  count: 30
  auto_expand: false
  min_pattern_length: 3

performance:
  max_text_length: 10000
  sliding_window_size: 512
  sliding_window_stride: 256
  cache_embeddings: true

qdrant:
  host: "localhost"
  port: 6333
  collection_name: "pubmed_papers"
  batch_size: 10

logging:
  level: "INFO"
  save_to_file: true
  log_file: "data/logs/classifier.log"

api:
  host: "127.0.0.1"
  port: 8004
  reload: false
  workers: 1
