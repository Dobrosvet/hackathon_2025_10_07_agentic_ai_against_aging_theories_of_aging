[tool.poetry]
name = "questions-criterias-classifier"
version = "1.0.0"
description = "Questions and Criterias Classifier Service using Bioformer-8L"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
qdrant-client = "^1.6.9"
transformers = "4.45.*"
accelerate = "1.1.*"
huggingface-hub = "^0.25.1"
safetensors = "^0.4.3"
bitsandbytes = ">=0.48,<0.49"
torch = "2.3.*"
tqdm = "^4.66.1"
httpx = "^0.28.1"
python-multipart = "^0.0.6"
pyyaml = "^6.0.1"
websockets = "^13.0.0"
sentence-transformers = "5.1.*"
tiktoken = "^0.12.0"
google-genai = "^1.46.0"
anthropic = "^0.40.0"
openai = "^1.50.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.0"
flake8 = "^6.1.0"


[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
